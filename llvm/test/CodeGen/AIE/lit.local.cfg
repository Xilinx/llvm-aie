if not 'AIE' in config.root.targets:
    config.unsupported = True

config.substitutions.insert(0, ('%topdown-multi', '--issue-limit=6 --aie-bottomup-cycles=0'))

# Z3 Solver support for AIE tests
# The enable_z3_solver config variable is set in llvm/test/lit.site.cfg.py.in
# based on the LLVM_ENABLE_Z3_SOLVER CMake option. We use hasattr() to safely
# check for its presence in case this lit.local.cfg is used in a context where
# the parent configuration hasn't been loaded.
if hasattr(config, 'enable_z3_solver') and config.enable_z3_solver:
    config.available_features.add("enable_z3_solver")
