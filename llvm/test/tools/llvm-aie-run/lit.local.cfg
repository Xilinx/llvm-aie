if not 'AIE' in config.root.targets:
    config.unsupported = True

# Compiler output needs linking before it can run. AIE control transfers and
# hardware-loop bounds take an absolute address, and llc spells those as label
# references (`j #.LBB0_2`, `movxm le, #.L_LEnd1`), so the assembler leaves a
# relocation behind. The hand-written .s tests here avoid that only by writing
# the numbers out, which is why just the .ll tests ask for a linker.
import lit.util
if lit.util.which('ld.lld', config.llvm_tools_dir):
    config.available_features.add('ld_lld')

config.suffixes = ['.s', '.ll']
